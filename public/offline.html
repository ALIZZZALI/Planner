<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین — برنامه‌ریز من</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #15161a;
        color: #f4f5f8;
        font-family: Vazirmatn, "IRANSans", "Segoe UI", Tahoma, system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .card {
        max-width: 26rem;
        border: 1px solid #2b2d34;
        background: #1d1e23;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { font-size: 0.875rem; line-height: 1.9; color: #b6b9c4; margin: 0; }
      a { color: #7cb0ff; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>فعلاً آفلاین هستید</h1>
      <p>
        این صفحه‌ی جایگزین است. اگر برنامه را قبلاً باز کرده باشید، نسخه‌ی اصلی از حافظه‌ی مرورگر
        باز می‌شود و همه‌ی تسک‌ها و تنظیمات شما روی همین دستگاه باقی می‌مانند.
      </p>
    </div>
  </body>
</html>
